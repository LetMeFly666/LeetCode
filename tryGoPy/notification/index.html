<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Notification Test</title>
</head>

<body>

<h1>浏览器通知测试</h1>

<button id="subscribe">
    授权通知
</button>

<hr>

<h2>发送通知</h2>

<input id="title" value="测试通知">
<br><br>

<input id="message" value="这是一条测试消息">
<br><br>

<button id="send">
    发送给所有用户
</button>

<pre id="result"></pre>

<script>

async function subscribe() {

    // 1. 请求通知权限
    const permission =
        await Notification.requestPermission();

    if (permission !== "granted") {
        alert("没有获得通知权限");
        return;
    }

    // 2. 注册 Service Worker
    const registration =
        await navigator.serviceWorker.register("/sw.js");

    // 等待 SW 激活
    await navigator.serviceWorker.ready;

    // 3. 获取服务器 VAPID 公钥
    const response =
        await fetch("/api/vapid-public-key");

    const { publicKey } =
        await response.json();

    // 4. Base64URL -> Uint8Array
    const applicationServerKey =
        urlBase64ToUint8Array(publicKey);

    // 5. 创建 Push Subscription
    let subscription =
        await registration.pushManager.getSubscription();

    if (!subscription) {
        subscription =
            await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey
            });
    }

    // 6. 保存到 Python 服务器
    await fetch("/api/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(subscription)
    });

    alert("通知授权成功");
}


async function sendNotification() {

    const title =
        document.getElementById("title").value;

    const message =
        document.getElementById("message").value;

    const response =
        await fetch("/api/send", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title,
                message
            })
        });

    const result =
        await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(result, null, 2);
}


function urlBase64ToUint8Array(base64String) {

    const padding =
        "=".repeat((4 - base64String.length % 4) % 4);

    const base64 =
        (base64String + padding)
            .replace(/-/g, "+")
            .replace(/_/g, "/");

    const rawData =
        window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(char => char.charCodeAt(0))
    );
}


document
    .getElementById("subscribe")
    .addEventListener("click", subscribe);

document
    .getElementById("send")
    .addEventListener("click", sendNotification);

</script>

</body>
</html>
